[package]
name = "open-media"
version = "0.1.0"
description = "Local recording, editing and media conversion"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "open_media_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "open-media"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [], optional = true }

[dependencies]
tauri = { version = "=2.12.3", features = ["protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "=2.8.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
getrandom = "0.3"
