[package]
name = "open-media"
version = "0.1.16"
description = "Local recording, editing and media conversion"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "open_media_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "open-media"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build", "dep:arboard"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "=2.7.2", features = [], optional = true }

[dependencies]
tauri = { version = "=2.12.3", features = ["protocol-asset", "macos-private-api"], optional = true }
tauri-plugin-dialog = { version = "=2.8.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
getrandom = "0.3"
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
tokio = { version = "=1.53.3", features = ["rt", "net", "sync", "time"] }
arboard = { version = "=3.6.1", optional = true }

reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
