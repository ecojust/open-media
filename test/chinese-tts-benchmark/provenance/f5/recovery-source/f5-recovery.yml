name: Recover F5 final corpus chunks without changing inference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: F5 corpus 10 chunk ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        part: [0, 1, 2]
    env:
      BENCH: test/chinese-tts-benchmark
      OUT: artifacts/f5
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inference dependencies
        run: |
          mkdir -p "$OUT/logs"
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install --no-cache-dir 'torch==2.9.1+cpu' 'torchaudio==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'vocos==0.1.0' 'torchdiffeq==0.2.5' 'x-transformers==1.44.4' 'pypinyin==0.55.0' 'rjieba==0.1.13' 'librosa==1.0.0' 'soundfile==0.14.0' 'safetensors==0.8.0' 'huggingface_hub==0.36.2'
          python -m pip freeze > "$OUT/requirements-resolved.txt"
          python -c 'import torch; assert torch.version.cuda is None; print(torch.__version__)'
      - name: Fetch fixed inference source and model files
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/f5-source"
          git -C "$RUNNER_TEMP/f5-source" init
          git -C "$RUNNER_TEMP/f5-source" remote add origin https://github.com/SWivid/F5-TTS.git
          git -C "$RUNNER_TEMP/f5-source" fetch --depth 1 origin 2f866649b779881af8bd644e76b9a6d95053da29
          git -C "$RUNNER_TEMP/f5-source" checkout --detach FETCH_HEAD
          python "$BENCH/scripts/f5-download.py" --output "$OUT" 2>&1 | tee "$OUT/logs/download.log"
          cp -r "$BENCH/scripts/f5-licenses" "$OUT/licenses"
          cp "$BENCH/reference/f5-matcha-intro.json" "$OUT/reference.json"
          cp "$BENCH/reference/f5-matcha-intro.wav" "$OUT/reference.wav"
          python "$BENCH/scripts/f5-environment.py" --output "$OUT" > "$OUT/logs/environment.log"
      - name: Recover one original corpus 10 chunk
        run: |
          set -o pipefail
          python "$BENCH/scripts/f5-benchmark.py" --output "$OUT" --source-dir "$RUNNER_TEMP/f5-source" --corpus "$BENCH/corpus.json" --reference "$BENCH/reference/f5-matcha-intro.wav" --start-index 10 --count 1 --chunk-index ${{ matrix.part }} --threads 4 2>&1 | tee "$OUT/logs/generation.log"
      - name: Upload real audio and provenance only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f5-recovery-${{ github.run_id }}-${{ matrix.part }}
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/f5/chunks/
            artifacts/f5/logs/
            artifacts/f5/licenses/
            artifacts/f5/sources.json
            artifacts/f5/hardware.json
            artifacts/f5/requirements-resolved.txt
            artifacts/f5/reference.json
            artifacts/f5/reference.wav
