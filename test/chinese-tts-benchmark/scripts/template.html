x 16px;color:#556057}.details summary{font-size:12px;font-weight:600;cursor:pointer}.details-body{padding-top:15px;display:grid;gap:16px}.model-details{padding-top:14px;border-top:1px solid #dad7ce}.model-details:first-child{border:0;padding:0}.model-details h3{font-size:13px;margin-bottom:8px}.details-grid{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:11px}.details-grid dt{color:#7a8076}.details-grid dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.methodology{font-size:11px;color:var(--muted);line-height:1.9;padding-top:20px;max-width:1120px}.methodology strong{font-weight:600;color:#4d5a50}.model-tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 12px}.model-tab{white-space:nowrap;font-size:12px}.model-tab.active{background:var(--soft);border-color:#b4c9b9;color:#27513f}.all-samples{display:grid;gap:10px}.sample-row{background:var(--white);border:1px solid var(--line);border-radius:13px;padding:16px 18px;display:grid;grid-template-columns:34px minmax(0,1fr) 160px;gap:10px;align-items:start}.sample-row.playing{border-color:#80a68c}.sample-row h3{font-size:13px;margin-bottom:5px}.sample-row p{font-size:13px;line-height:1.9}.sample-row .focus{font-size:10px;color:var(--muted);margin-top:8px}.sample-row .player{margin:0}.sample-row .play-button{height:36px;width:36px}.row-metrics{font-size:10px;color:var(--muted);text-align:right;margin-top:9px}.empty{padding:36px;background:#fffefa;border:1px solid var(--line);border-radius:14px}.empty h2{font-size:18px;margin-bottom:10px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}footer{padding-top:25px;margin-top:28px;border-top:1px solid var(--line);font-size:10px;display:flex;justify-content:space-between;gap:14px;color:var(--muted)}.blind-message{background:#e9eee8;border:1px solid #cfdacb;padding:11px 14px;border-radius:10px;margin-bottom:14px;color:#3e5843;font-size:12px}.badge{font-size:10px;color:#4     .sample-record{margin-top:13px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.sample-record summary{cursor:pointer;font-weight:550;color:#46624f}.sample-record dl{margin:10px 0 0}.sample-record dt{font-size:10px;color:#7b8278;margin-top:9px}.sample-record dd{margin:3px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;color:#515d54}.sample-record pre{font:10px/1.7 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;margin:8px 0 0}.sample-record .record-raw{margin-top:11px;padding-top:8px;border-top:1px solid var(--line)}

<body>
  <header><div class="masthead"><div><p class="eyebrow">Open Media · Listening Room</p><div class="title-row"><div class="brand-mark" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 10v4m4-8v12m5-16v20m5-15v10m4-7v4"/></svg></div><h1>中文离线语音试听对比</h1></div><p class="lede" id="description">同一段原文，听清声音之间的差别。保留原始语速与音量，只记录实际生成结果。</p></div><div class="session-note" id="session-note"></div></div></header>
  <main class="page" id="app"><div class="empty"><h2>这是尚未填入评测结果的页面模板</h2><p>请使用同目录的打包脚本读取真实生成清单。此模板没有试听音频，也不是可发布的评测结果。</p></div></main>
  <script>
  'use strict';
  const DATA = /*__COMPARISON_DATA__*/ null;
  (() => {
    if (!DATA) return;
    const $ = (selector, root = document) => root.querySelector(selector);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
    const icon = (name, size = 17) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${({play:'<path d="m9 5 11 7-11 7z" fill="currentColor" stroke="none"/>',pause:'<path d="M9 5v14M16 5v14" stroke-width="3"/>',left:'<path d="m14 6-6 6 6 6"/>',right:'<path d="m10 6 6 6-6 6"/>',eye:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',hidden:'<path d="m3 3 18 18M9.5 5.3A12 12 0 0 1 12 5c7 0 10 7 10 7a16 16 0 0 1-3.3 4.3M6.5 6.5A18 18 0 0 0 2 12s3 7 10 7a12 12 0 0 0 5.5-1.5M10 10a3 3 0 0 0 4 4"/>',shuffle:'<path d="M3 6h3c4 0 8 12 12 12h3m-4-4 4 4-4 4M3 18h3c1.6 0 3.1-1.8 4.6-4.1M13.5 9.4C15 7.3 16.5 6 18 6h3m-4-4 4 4-4 4"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>'})[name] || ''}</svg>`;
    const bytes = value => value == null ? '未测量' : value >= 1e9 ? `${(value / 1e9).toFixed(2)} GB` : `${(value / 1e6).toFixed(1)} MB`;
    const seconds = value => `${Number(value).toFixed(2)} 秒`;
    const clock = value => { const time = Math.max(0, Math.floor(Number(value) || 0)); return `${Math.floor(time / 60)}:${String(time % 60).padStart(2, '0')}`; };
    const detailText = value => typeof value === 'string' ? value : JSON.stringify(value, null, 2);
    const models = [...DATA.models].sort((a, b) => a.model_download_bytes - b.model_download_bytes || a.id.localeCompare(b.id));
    const state = { mode: 'sentence', sentence: DATA.corpus[0].id, model: models[0].id, blind: false, hadBlind: false, order: models.map(model => model.id), active: null, loading: false, playRequest: 0 };
    const audio = new Audio(); audio.preload = 'none'; audio.volume = 1; audio.playbackRate = 1;
    const label = model => state.blind ? `声音 ${String.fromCharCode(65 + state.order.indexOf(model.id))}` : model.name;
    const sampleFor = (model, id) => model.samples.find(sample => sample.id === id);
    const sortedModels = () => state.blind ? state.order.map(id => models.find(model => model.id === id)) : models;
    const keyFor = (model, sample) => `${model.id}/${sample.id}`;
    const safeURL = value => { try { const url = new URL(value); return ['https:', 'http:'].includes(url.protocol) ? url.href : ''; } catch { return ''; } };
    function announce(message, error = false) { const node = $('#status'); if (node) { node.textContent = message; node.classList.toggle('error', error); } }
    function stop() { state.playRequest++; audio.pause(); audio.removeAttribute('src'); audio.load(); state.active = null; state.loading = false; }
    function shuffle() { const order = models.map(model => model.id); for (let index = order.length - 1; index > 0; index--) { const value = new Uint32Array(1); crypto.getRandomValues(value); const other = value[0] % (index + 1); [order[index], order[other]] = [order[other], order[index]]; } state.order = order; state.model = order[0]; }
    function player(model, sample) { const key = keyFor(model, sample); return `<div class="player"><button class="play-button" data-play="${esc(key)}" aria-label="播放 ${esc(label(model))} · ${esc(DATA.corpus.find(row => row.id === sample.id).title)}" aria-pressed="false">${icon('play',20)}</button><div class="player-body"><div class="player-caption"><span data-player-state="${esc(key)}">原始语速 · 1×</span><span data-time="${esc(key)}">0:00 / ${clock(sample.duration_seconds)}</span></div><input type="range" class="progress" min="0" max="${sample.duration_seconds}" step="0.01" value="0" data-seek="${esc(key)}" aria-label="${esc(label(model))} · ${sample.id} 播放进度" disabled></div></div>`; }
    function sampleDetails(sample) {
      if(state.blind)return '';
      const record=sample.source_record||{}, normalized=sample.normalized_text;
      const notes=record.notes ?? record.note ?? record.normalization_notes;
      const reuse=Object.fromEntries(Object.entries(record).filter(([key,value])=>/reus|reuse|复用/i.test(key)&&value!=null&&value!==false));
      const hasReuse=Object.keys(reuse).length>0;
      const label=normalized&&normalized!==sample.text?' · 含前端规范化':hasReuse?' · 含复用记录':'';
      const log=record.log??record.logs;
      return `<details class="sample-record"><summary>本句输入与生成记录${label}</summary><dl>${normalized?`<dt>实际送入推理的文本${normalized===sample.text?'（与原文一致）':''}</dt><dd>${esc(normalized)}</dd>`:'<dt>推理输入记录</dt><dd>原文及模型前端设置见原始生成清单；此样本未单列规范化文本。</dd>'}${notes!=null?`<dt>本句处理说明</dt><dd>${esc(detailText(notes))}</dd>`:''}${hasReuse?`<dt>音频复用来源与计时</dt><dd>${esc(detailText(reuse))}</dd>`:''}<dt>生成耗时记录范围</dt><dd>${esc(sample.generation_notes)}</dd>${record.peak_rss_bytes!=null?`<dt>本次峰值进程内存</dt><dd>${bytes(record.peak_rss_bytes)}</dd>`:''}${log?`<dt>原始日志路径（详见资料包 provenance）</dt><dd>${esc(detailText(log))}</dd>`:''}</dl><details class="record-raw"><summary>原始样本元数据</summary><pre>${esc(detailText(record))}</pre></details></details>`;
    }
    function card(model, index, sample) { return `<article class="model-card" data-card="${esc(keyFor(model,sample))}"><div class="model-ordinal">${state.blind ? '隐藏模型信息' : `按体积排序 · ${String(index + 1).padStart(2,'0')}${state.hadBlind ? ' · 盲听 ' + String.fromCharCode(65 + state.order.indexOf(model.id)) : ''}`}</div><h3 class="model-name">${esc(label(model))}</h3><p class="voice">${state.blind ? '先听声音，再显示模型信息' : esc(detailText(model.voice))}</p>${state.blind ? '<div class="size neutral-size">盲听中</div><div class="size-label">体积、参数与耗时已隐藏</div>' : `<div class="size" title="${model.model_download_bytes.toLocaleString('zh-CN')} 字节">${bytes(model.model_download_bytes)}</div><div class="size-label">实际完整模型下载 · 运行库另计</div><div class="metrics"><div><span class="metric-label">本句实际生成</span><span class="metric-value">${seconds(sample.generation_seconds)}</span></div><div><span class="metric-label">原始音频时长</span><span class="metric-value">${seconds(sample.duration_seconds)}</span></div></div>`}${player(model,sample)}<div class="card-footer"><span>${state.blind ? '同一原文 · 同一播放设置' : `${sample.sample_rate.toLocaleString('zh-CN')} Hz · ${sample.channels === 1 ? '单声道' : `${sample.channels} 声道`}`}</span>${!DATA.standalone && !state.blind ? `<a href="${esc(sample.wav)}" download aria-label="下载 ${esc(model.name)} 第 ${sample.id} 条原始 WAV">原始 WAV</a>` : '<span>本地音频</span>'}</div>${sampleDetails(sample)}</article>`; }
    function sourceLinks(model) { return model.sources.map(source => { const url = typeof source === 'string' ? source : source.url; const name = typeof source === 'string' ? source : source.name || source.url; const safe = safeURL(url); return safe ? `<a class="source-link" href="${esc(safe)}" target="_blank" rel="noopener noreferrer">${esc(name)}</a>` : esc(detailText(source)); }).join(' '); }
    function details() { if (state.blind) return ''; return `<details class="details"><summary>查看模型来源、下载与解包大小、实际运行环境</summary><div class="details-body">${models.map(model => `<section class="model-details"><h3>${esc(model.name)}</h3><dl class="details-grid"><dt>实际完整模型下载</dt><dd>${bytes(model.model_download_bytes)}（${model.model_download_bytes.toLocaleString('zh-CN')} 字节）\n${esc(detailText(model.download_scope))}</dd><dt>必需解包组件</dt><dd>${model.model_unpacked_bytes == null ? '未单独拆分；计量范围见上' : `${bytes(model.model_unpacked_bytes)}（${model.model_unpacked_bytes.toLocaleString('zh-CN')} 字节）`}</dd><dt>其中权重文件</dt><dd>${model.weights_bytes == null ? '未单独拆分；以组件清单为准' : `${bytes(model.weights_bytes)}（${model.weights_bytes.toLocaleString('zh-CN')} 字节）`}</dd><dt>运行库体积</dt><dd>${model.runtime_download_bytes == null ? '未计入' : bytes(model.runtime_download_bytes)} · ${esc(model.runtime_size_notes)}</dd><dt>峰值进程内存</dt><dd>${bytes(model.peak_rss_bytes)}\n${esc(model.memory_notes)}</dd><dt>硬件</dt><dd>${esc(detailText(model.hardware))}</dd><dt>运行环境</dt><dd>${esc(detailText(model.runtime))}</dd><dt>声音与合成参数</dt><dd>${esc(detailText(model.settings))}</dd><dt>生成耗时范围</dt><dd>${esc(model.samples[0].generation_notes)}</dd>${model.reference_audio?`<dt>合成参考声音</dt><dd>${esc(detailText(model.reference_audio))}</dd>`:''}${model.normalization?`<dt>标准文本前端</dt><dd>${esc(detailText(model.normalization))}</dd>`:''}${model.implementation_notes?`<dt>本次推理实现</dt><dd>${esc(detailText(model.implementation_notes))}</dd>`:''}${model.diagnostic_group?`<dt>原始诊断记录</dt><dd>${esc(detailText(model.diagnostic_group))}</dd>`:''}<dt>模型来源</dt><dd>${sourceLinks(model)}</dd><dt>许可</dt><dd>${esc(detailText(model.license))}</dd>${model.notes?.length ? `<dt>本次记录</dt><dd>${esc(detailText(model.notes))}</dd>` : ''}</dl></section>`).join('')}</div></details>`; }
    function sentenceView() { const row = DATA.corpus.find(row => row.id === state.sentence); const index = DATA.corpus.indexOf(row); return `<div class="workspace"><aside class="sentences" aria-label="测试语料"><div class="section-label"><span>统一中文语料</span><span>10 段</span></div><div class="sentence-list">${DATA.corpus.map(item => `<button class="sentence-button${item.id === row.id ? ' active' : ''}" data-sentence="${item.id}" aria-current="${item.id === row.id ? 'true' : 'false'}"><span class="sentence-number">${item.id}</span><span><span class="sentence-title">${esc(item.title)}</span><span class="sentence-sub">${item.text.length} 字符 · 所有模型同文</span></span></button>`).join('')}</div></aside><div class="content"><section class="script"><div class="script-heading"><span class="script-kicker">原文 ${row.id} / 10</span><div class="script-navigation"><button data-step="-1" aria-label="上一段语料"${index === 0 ? ' disabled' : ''}>${icon('left',15)}</button><button data-step="1" aria-label="下一段语料"${index === 9 ? ' disabled' : ''}>${icon('right',15)}</button></div></div><h2>${esc(row.title)}</h2><p class="script-text">${esc(row.text)}</p><p class="script-focus">${esc(row.focus)}</p></section><div class="compare-heading"><h2>同一句，逐个听</h2><p>${state.blind ? '顺序已随机 · 名称与数据暂时隐藏' : '按实际完整模型下载量从小到大 · 不是质量排名'}</p></div><div class="cards">${sortedModels().map((model,index) => card(model,index,sampleFor(model,row.id))).join('')}</div>${details()}</div></div>`; }
    function modelView() { const model = models.find(model => model.id === state.model); return `<div class="model-tabs" role="group" aria-label="选择试听模型">${sortedModels().map(item => `<button class="model-tab${item.id === model.id ? ' active' : ''}" data-model="${esc(item.id)}" aria-pressed="${item.id === model.id}">${esc(label(item))}${state.blind ? '' : `<span class="badge">${bytes(item.model_download_bytes)}</span>`}</button>`).join('')}</div><div class="all-samples">${DATA.corpus.map(row => {const sample=sampleFor(model,row.id);return `<article class="sample-row" data-card="${esc(keyFor(model,sample))}"><span class="sentence-number">${row.id}</span><div><h3>${esc(row.title)}</h3><p>${esc(row.text)}</p><p class="focus">${esc(row.focus)}</p>${sampleDetails(sample)}</div><div class="sample-controls">${player(model,sample)}${state.blind ? '' : `<div class="row-metrics">生成 ${seconds(sample.generation_seconds)} · 音频 ${seconds(sample.duration_seconds)}</div>`}</div></article>`;}).join('')}</div>${details()}`; }
    function render() { $('#app').innerHTML = `<div class="toolbar"><div class="tabs" role="group" aria-label="试听方式"><button data-mode="sentence" aria-pressed="${state.mode === 'sentence'}">按句对比</button><button data-mode="model" aria-pressed="${state.mode === 'model'}">按模型查看</button></div><div class="toolbar-actions"><button class="blind-toggle" id="blind-toggle" aria-pressed="${state.blind}">${icon(state.blind?'eye':'hidden')}${state.blind?'显示模型':'随机盲听'}</button>${state.blind ? `<button id="shuffle" aria-label="重新打乱盲听顺序">${icon('shuffle')}重新打乱</button>` : ''}<span class="hint">${models.length} 个模型 · ${models.length * DATA.corpus.length} 段音频</span></div></div>${state.blind ? '<div class="blind-message">盲听模式已随机排序，并隐藏名称、体积和耗时。播放同一段原文后，可点击“显示模型”查看对应结果。</div>' : ''}<div class="status" id="status" role="status" aria-live="polite">点击播放开始试听；切换音频会自动停止上一段。</div>${state.mode === 'sentence' ? sentenceView() : modelView()}<p class="methodology"><strong>比较方式：</strong>所有模型使用同一套中文原文，保留数字和多音词。模型官方前端的规范化输入与音频复用记录在“本句输入与生成记录”中另列，原文不会被替换。试听文件仅从原始 WAV 编码为 MP3，没有进行音量增强、变速、降噪或停顿裁剪。<strong>体积说明：</strong>实际模型下载量、解包组件、运行库与峰值进程内存分别记录，模型大小不是运行内存，也不是完整软件安装包。<strong>耗时说明：</strong>本批包含本地 2 CPU 配额与云端运行机器，部分本地推理共享 CPU。此处为实际计时，不是同机独占速度排行，也不代表 Mac 真机速度。各模型的固定声音或合成参考不同，参数中分别注明。${DATA.standalone ? '单文件页面内含全部试听音频；原始 WAV 在单独的原始音频包中。' : '原始 WAV、生成清单及 provenance 证据目录随资料包提供，可核对日志、合成参考和复用来源。'}这是人工试听材料，没有自然度评分。</p><footer><span>Open Media · 中文语音评测资料</span><span>资料整理 ${esc(DATA.created_at)} · 全部音频可离线播放</span></footer>`; sync(); }
    function sync() { document.querySelectorAll('[data-play]').forEach(button => { const active = button.dataset.play === state.active; const playing = active && !audio.paused; button.innerHTML = icon(playing ? 'pause' : 'play',20); button.setAttribute('aria-pressed', String(playing)); button.setAttribute('aria-label', `${playing ? '暂停' : '播放'} ${active ? currentLabel() : button.getAttribute('aria-label').replace(/^(播放|暂停) /,'')}`); const key = button.dataset.play; const card = [...document.querySelectorAll('[data-card]')].find(item => item.dataset.card === key); card?.classList.toggle('playing',playing); const input = [...document.querySelectorAll('[data-seek]')].find(item => item.dataset.seek === key); if (input) { input.disabled = !active || state.loading; input.value = active ? String(Math.min(audio.currentTime || 0,Number(input.max))) : '0'; } const stamp = [...document.querySelectorAll('[data-time]')].find(item => item.dataset.time === key); const [id,sampleId] = key.split('/'); const sample = sampleFor(models.find(model => model.id === id),sampleId); if(stamp)stamp.textContent = `${clock(active ? audio.currentTime : 0)} / ${clock(sample.duration_seconds)}`; const caption = [...document.querySelectorAll('[data-player-state]')].find(item => item.dataset.playerState === key); if(caption)caption.textContent = active && state.loading ? '正在读取音频…' : playing ? '正在播放 · 1×' : '原始语速 · 1×'; }); }
    function currentLabel() { if (!state.active) return ''; const [id,sampleId] = state.active.split('/'); return `${label(models.find(model => model.id === id))} · ${DATA.corpus.find(row => row.id === sampleId).title}`; }
    async function play(key) { if (state.active === key && !audio.paused) { audio.pause(); announce(`已暂停：${currentLabel()}`); sync(); return; } const request = ++state.playRequest; if (state.active !== key) { audio.pause(); const [id,sampleId] = key.split('/'); const model = models.find(model => model.id === id), sample = sampleFor(model,sampleId); audio.src = sample.mp3; state.active = key; } else if (audio.ended) audio.currentTime = 0; state.loading = true; audio.volume = 1; audio.playbackRate = 1; sync(); announce(`正在读取：${currentLabel()}`); try { await audio.play(); if(request!==state.playRequest)return; state.loading=false;sync();announce(`正在播放：${currentLabel()}。保持原始语速与音量。`); } catch(error) { if(request!==state.playRequest)return; state.loading=false;sync();announce('音频无法播放。请确认下载了完整资料包，或使用包含音频的单文件 HTML。',true); } }
    $('#app').addEventListener('click', event => { const button = event.target.closest('button'); if(!button||button.disabled)return;if(button.dataset.play){void play(button.dataset.play);return;}if(button.dataset.mode){stop();state.mode=button.dataset.mode;render();return;}if(button.dataset.sentence){stop();state.sentence=button.dataset.sentence;render();return;}if(button.dataset.model){stop();state.model=button.dataset.model;render();return;}if(button.dataset.step){stop();state.sentence=DATA.corpus[DATA.corpus.findIndex(row=>row.id===state.sentence)+Number(button.dataset.step)].id;render();return;}if(button.id==='blind-toggle'){stop();state.blind=!state.blind;if(state.blind){state.hadBlind=true;shuffle();}render();announce(state.blind?'已进入随机盲听，模型信息已隐藏。':'已显示模型并按体积排序，卡片保留上次盲听编号供核对。');return;}if(button.id==='shuffle'){stop();shuffle();render();announce('盲听顺序已重新随机排列。');} });
    $('#app').addEventListener('input', event => { const input=event.target.closest('[data-seek]');if(input&&input.dataset.seek===state.active&&!state.loading){audio.currentTime=Number(input.value);sync();} });
    for(const name of ['timeupdate','pause','playing','loadedmetadata'])audio.addEventListener(name,sync);
    audio.addEventListener('ended',()=>{sync();announce(`播放结束：${currentLabel()}`);});
    audio.addEventListener('error',()=>{if(!state.active)return;state.loading=false;sync();announce('音频读取失败。请使用完整资料包或内含音频的单文件页面。',true);});
    window.addEventListener('pagehide',stop);
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.active){stop();sync();announce('已停止试听。');}});
    $('#description').textContent=`同一段原文，听清声音之间的差别。${models.length} 个真实模型 · 10 种语料 · 原始语速与音量。`;
    $('#session-note').textContent='完全离线试听\n不提供未经评定的质量排名';
    render();
  })();
  </script>
</body>
</html>
