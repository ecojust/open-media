name: Recover verified AI runtime release

on:
  push:
    branches: ['feat/shared-ai-generation-*', 'work/ai-runtime-*']
    paths: ['.github/workflows/ai-runtime-publish.yml']
  workflow_dispatch:
    inputs:
      runtime_build_run_id:
        description: Existing three-platform verified runtime build run
        required: true
        default: '39279110019'
        type: string
      release_id:
        description: Existing pinned draft release ID, created with an authorized user token
        required: true
        default: '417493689'
        type: string
      source_commit:
        description: Exact commit used for the existing runtime build
        required: true
        default: '850bfe5fcdd2168f645836687de1392d65d4f714'
        type: string

permissions:
  contents: write
  actions: read
  checks: write

concurrency:
  group: ai-runtime-release-v1
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      BUILD_RUN_ID: ${{ inputs.runtime_build_run_id }}
      BUILD_COMMIT: ${{ inputs.source_commit }}
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard immutable release and reserve artifact space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          mkdir -p runtime-artifacts
          df -h .
      - name: Verify artifact digests, source commit, parts and manifests
        id: verify
        run: |
          set -o pipefail
          python scripts/test-ai-runtime-publish.py
          python scripts/ai-runtime-recover.py --run "$BUILD_RUN_ID" --commit "$BUILD_COMMIT" --root runtime-artifacts 2>&1 | tee runtime-artifacts/recovery.log
      - name: Publish immutable independent runtime
        id: release
        run: |
          set -o pipefail
          python scripts/ai-runtime-release.py --root runtime-artifacts --release "$RELEASE_ID" --commit "$BUILD_COMMIT" 2>&1 | tee runtime-artifacts/publish.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-runtime-publish-evidence-${{ github.run_id }}
          path: |
            runtime-artifacts/*.log
            runtime-artifacts/*.json
            runtime-artifacts/SHA256SUMS.txt
          retention-days: 14
      - name: Record independently readable publication result
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const conclusion = process.env.VERIFY_OUTCOME === 'success' && process.env.RELEASE_OUTCOME === 'success' ? 'success' : 'failure';
            const text = ['recovery.log', 'publish.log'].map(name => {
              const path = `runtime-artifacts/${name}`;
              const content = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(-20000) : 'No log produced.';
              return `### ${name}\n\n\`\`\`text\n${content.replace(/https?:\/\/[^\s"<>]+/g, url => url.split('?')[0])}\n\`\`\``;
            }).join('\n\n');
            await github.rest.checks.create({ owner: context.repo.owner, repo: context.repo.repo,
              name: 'AI runtime publication evidence', head_sha: context.sha, status: 'completed', conclusion,
              completed_at: new Date().toISOString(),
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {title: `Runtime publication: ${conclusion}`,
                summary: `Existing runtime build ${process.env.BUILD_RUN_ID}; source ${process.env.BUILD_COMMIT}. Verification: ${process.env.VERIFY_OUTCOME}; publication: ${process.env.RELEASE_OUTCOME}. No environments rebuilt.`, text}});
