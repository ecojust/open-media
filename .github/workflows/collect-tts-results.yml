name: Collect Chinese voice benchmark results

on:
  workflow_dispatch:
    inputs:
      model:
        description: Completed voice benchmark
        type: choice
        required: true
        options: [f5, qwen]
      run_id:
        description: Existing benchmark workflow run ID
        type: string
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: collect-tts-results-${{ inputs.model }}-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODEL: ${{ inputs.model }}
      SOURCE_RUN: ${{ inputs.run_id }}
    steps:
      - name: Prepare collection paths
        run: |
          echo "DOWNLOAD_ROOT=$RUNNER_TEMP/tts-result-artifacts" >> "$GITHUB_ENV"
          echo "SOURCE_METADATA=$RUNNER_TEMP/tts-result-source.json" >> "$GITHUB_ENV"

      - name: Verify source run and complete artifact set
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const model = process.env.MODEL;
            const sourceRun = process.env.SOURCE_RUN;
            if (!['f5', 'qwen'].includes(model) || !/^[1-9][0-9]{0,17}$/.test(sourceRun)) {
              throw new Error('Expected a supported model and a numeric workflow run ID.');
            }
            const runId = Number(sourceRun);
            if (!Number.isSafeInteger(runId)) throw new Error('Workflow run ID is outside the supported range.');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const workflow = model === 'f5' ? '.github/workflows/f5-benchmark.yml' : '.github/workflows/tts-benchmark.yml';
            if (run.repository.full_name !== repository || run.head_repository?.full_name !== repository ||
                run.path.split('@')[0] !== workflow || run.event !== 'workflow_dispatch') {
              throw new Error('The source run must belong to this repository and the expected benchmark workflow.');
            }
            if (run.status !== 'completed') throw new Error('Wait for the source workflow to complete before collecting results.');
            const base = model === 'f5' ? `f5-chinese-tts-${sourceRun}` : `chinese-voice-qwen3-1.7b-${sourceRun}`;
            const pattern = model === 'f5' ? `${base}-*` : `${base}*`;
            const all = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: runId, per_page: 100
            });
            const artifacts = all.filter(artifact => model === 'f5' ? artifact.name.startsWith(`${base}-`) : artifact.name.startsWith(base));
            const shards = [1, 3, 5, 7, 9].map(start => model === 'f5' ? `${base}-${start}` : `${base}-part-${start}`);
            const complete = model === 'qwen' && artifacts.length === 1 && artifacts[0].name === base;
            const partitioned = artifacts.length === 5 && shards.every(name => artifacts.some(artifact => artifact.name === name));
            if (!complete && !partitioned) throw new Error('Expected all five distinct shards, or one complete output for the selected model.');
            if (artifacts.some(artifact => artifact.expired)) throw new Error('A source artifact has expired.');
            if (artifacts.reduce((total, artifact) => total + artifact.size_in_bytes, 0) > 250 * 1024 * 1024) {
              throw new Error('Artifact archive size exceeds the audio-only collection limit.');
            }
            if (run.conclusion !== 'success') core.warning(`Source workflow concluded ${run.conclusion}; all ten audio pairs will still be required.`);
            artifacts.sort((left, right) => left.name.localeCompare(right.name));
            fs.writeFileSync(process.env.SOURCE_METADATA, JSON.stringify({
              model, sourceRun, repository, workflow, sourceCommit: run.head_sha,
              sourceUrl: run.html_url, sourceConclusion: run.conclusion,
              artifacts: artifacts.map(({id, name, size_in_bytes, digest}) => ({id, name, size_in_bytes, digest}))
            }, null, 2));
            core.setOutput('pattern', pattern);
            core.setOutput('branch', `research/tts-outputs-${model}-${sourceRun}`);

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download existing audio artifacts without rerunning inference
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          pattern: ${{ steps.source.outputs.pattern }}
          merge-multiple: false
          path: ${{ env.DOWNLOAD_ROOT }}

      - name: Select the isolated results branch
        env:
          RESULT_BRANCH: ${{ steps.source.outputs.branch }}
        run: |
          set -euo pipefail
          test "$RESULT_BRANCH" = "research/tts-outputs-$MODEL-$SOURCE_RUN"
          existing="$(git ls-remote --heads origin "refs/heads/$RESULT_BRANCH")"
          if [[ -n "$existing" ]]; then
            git fetch --no-tags origin "refs/heads/$RESULT_BRANCH"
            git switch --create "$RESULT_BRANCH" FETCH_HEAD
          else
            git switch --create "$RESULT_BRANCH"
          fi

      - name: Validate audio-only files and preserve source records
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, stat
          from pathlib import Path

          source = Path(os.environ['DOWNLOAD_ROOT'])
          metadata = json.loads(Path(os.environ['SOURCE_METADATA']).read_text())
          model, run_id = metadata['model'], metadata['sourceRun']
          expected_artifacts = {item['name'] for item in metadata['artifacts']}
          assert source.is_dir() and not source.is_symlink(), 'Invalid artifact directory'
          assert {item.name for item in source.iterdir()} == expected_artifacts, 'Downloaded artifact set differs from verified source run'
          maximum_file = 50 * 1024 * 1024
          maximum_total = 250 * 1024 * 1024
          forbidden = {'.onnx', '.pt', '.pth', '.safetensors', '.bin', '.ckpt', '.h5', '.hdf5', '.pkl', '.pickle', '.npz', '.npy', '.model', '.gguf', '.tflite'}
          root_files = {'manifest.json'} if model == 'qwen' else {
              'manifest.json', 'records.json', 'sources.json', 'hardware.json',
              'requirements-resolved.txt', 'reference.json', 'reference.wav'
          }
          allowed_dirs = {'audio', 'wav', 'logs', 'licenses'} if model == 'qwen' else {'audio', 'logs', 'licenses'}
          audio_ids = {'wav': set(), 'mp3': set()}
          files, total = [], 0
          for artifact_name in sorted(expected_artifacts):
              artifact = source / artifact_name
              assert artifact.is_dir() and not artifact.is_symlink(), f'Invalid artifact: {artifact_name}'
              payload = artifact / 'qwen3-tts-1.7b-serena' if model == 'qwen' else artifact
              if model == 'qwen':
                  assert {item.name for item in artifact.iterdir()} == {'qwen3-tts-1.7b-serena'}, 'Unexpected voice output directory'
              assert payload.is_dir() and not payload.is_symlink(), 'Invalid payload directory'
              artifact_ids = {'wav': set(), 'mp3': set()}
              for directory, subdirs, names in os.walk(payload, followlinks=False):
                  for name in subdirs + names:
                      path = Path(directory) / name
                      info = path.lstat()
                      relative = path.relative_to(payload)
                      assert not any(part.startswith('.') for part in relative.parts), f'Hidden file is not permitted: {relative}'
                      assert not stat.S_ISLNK(info.st_mode), f'Symbolic link is not permitted: {relative}'
                      assert path.resolve().is_relative_to(payload.resolve()), f'Path escaped artifact: {relative}'
                      if stat.S_ISDIR(info.st_mode):
                          assert relative.parts[0] in allowed_dirs, f'Unexpected directory: {relative}'
                          continue
                      assert stat.S_ISREG(info.st_mode), f'Non-regular file is not permitted: {relative}'
                      assert path.suffix.lower() not in forbidden, f'Model weights are not permitted: {relative}'
                      assert info.st_size <= maximum_file, f'File exceeds 50 MB: {relative}'
                      total += info.st_size
                      assert total <= maximum_total, 'Extracted files exceed the audio-only collection limit'
                      if len(relative.parts) == 1:
                          assert relative.name in root_files, f'Unexpected root file: {relative}'
                      elif relative.parts[0] in {'audio', 'wav'}:
                          assert len(relative.parts) == 2 and path.suffix.lower() in {'.wav', '.mp3'}, f'Unexpected audio file: {relative}'
                          assert path.stem in {f'{index:02d}' for index in range(1, 11)}, f'Unknown corpus ID: {relative}'
                          kind = path.suffix.lower()[1:]
                          assert path.stem not in audio_ids[kind], f'Duplicate corpus audio: {relative}'
                          audio_ids[kind].add(path.stem)
                          artifact_ids[kind].add(path.stem)
                      elif relative.parts[0] in {'logs', 'licenses'}:
                          assert path.suffix.lower() in {'.json', '.txt', '.log', '.md', '.html'} or relative.name in {'LICENSE', 'NOTICE', 'COPYING'}, f'Unexpected supporting file: {relative}'
                      else:
                          raise AssertionError(f'Unexpected file: {relative}')
                      contents = path.read_bytes()
                      if path.suffix.lower() == '.wav':
                          assert len(contents) > 44 and contents[:4] == b'RIFF' and contents[8:12] == b'WAVE', f'Invalid WAV header: {relative}'
                      elif path.suffix.lower() == '.mp3':
                          assert len(contents) > 4 and (contents[:3] == b'ID3' or (contents[0] == 255 and contents[1] & 224 == 224)), f'Invalid MP3 header: {relative}'
                      else:
                          text = contents.decode('utf-8')
                          if path.suffix.lower() == '.json':
                              json.loads(text)
                      files.append({'path': str(path.relative_to(source)), 'bytes': len(contents), 'sha256': hashlib.sha256(contents).hexdigest()})
                      assert len(files) <= 1000, 'Too many files in artifacts'
              assert (payload / 'manifest.json').is_file(), 'Missing generation manifest'
              assert artifact_ids['wav'] == artifact_ids['mp3'], 'Every sample requires original WAV and encoded MP3'
              expected_count = 10 if len(expected_artifacts) == 1 else 2
              assert len(artifact_ids['wav']) == expected_count, 'Artifact has an incomplete corpus partition'
          required = {f'{index:02d}' for index in range(1, 11)}
          assert audio_ids['wav'] == required and audio_ids['mp3'] == required, 'All ten corpus samples must be complete'
          destination = Path('test/chinese-tts-benchmark/incoming') / model / run_id
          if destination.exists():
              assert destination.is_dir() and not destination.is_symlink(), 'Unsafe existing results directory'
              shutil.rmtree(destination)
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(source, destination)
          metadata['files'] = files
          metadata['totalBytes'] = total
          (destination / 'collection.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + '\n')
          print(f'Validated {len(files)} files ({total:,} bytes), including all ten WAV/MP3 pairs; preserved artifact directories and original metadata.')
          PY

      - name: Commit results to the isolated branch only
        env:
          RESULT_BRANCH: ${{ steps.source.outputs.branch }}
        run: |
          set -euo pipefail
          test "$RESULT_BRANCH" = "research/tts-outputs-$MODEL-$SOURCE_RUN"
          test "$(git branch --show-current)" = "$RESULT_BRANCH"
          destination="test/chinese-tts-benchmark/incoming/$MODEL/$SOURCE_RUN"
          git add -f -- "$destination"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '保存中文配音对比生成资料 [skip ci]'
          fi
          git push origin "HEAD:refs/heads/$RESULT_BRANCH"
          {
            echo '### 已保存现有中文配音生成资料'
            echo
            echo "结果分支：\`$RESULT_BRANCH\`"
            echo "资料目录：\`$destination\`"
            echo '完整保留已有音频、清单、日志和许可证，未重新执行语音生成。'
          } >> "$GITHUB_STEP_SUMMARY"
