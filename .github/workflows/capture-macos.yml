name: Verify installed macOS recording

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installed-capture:
    name: Installed application on macOS 26 ARM64
    runs-on: macos-26
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Record actual host and source identity
        run: |
          mkdir -p test-results/macos-capture
          {
            sw_vers
            uname -a
            xcrun swiftc --version
            git rev-parse HEAD
            echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          } 2>&1 | tee test-results/macos-capture/environment.log
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Inspect the released application at the installed path
        id: baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline="$RUNNER_TEMP/open-media-capture-baseline"
          mkdir -p "$baseline/download" "$baseline/mount"
          gh release download v0.1.4 --repo "$GITHUB_REPOSITORY" --pattern Open-Media_0.1.4_macos-arm64.dmg --pattern SHA256SUMS --dir "$baseline/download"
          (
            cd "$baseline/download"
            awk '$2 == "Open-Media_0.1.4_macos-arm64.dmg" { print }' SHA256SUMS > baseline.sha256
            test "$(wc -l < baseline.sha256 | tr -d ' ')" = 1
            shasum -a 256 -c baseline.sha256
          )
          cp "$baseline/download/baseline.sha256" test-results/macos-capture/baseline.sha256
          hdiutil attach "$baseline/download/Open-Media_0.1.4_macos-arm64.dmg" -readonly -nobrowse -mountpoint "$baseline/mount"
          trap 'hdiutil detach "$baseline/mount" || true' EXIT
          test -d "$baseline/mount/Open Media.app"
          sudo ditto "$baseline/mount/Open Media.app" '/Applications/Open Media.app'
          node scripts/check-macos-capture.mjs baseline
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: aarch64-apple-darwin
      - uses: actions/cache/restore@v4
        id: media-cache
        with:
          path: |
            src-tauri/resources/media
            .media-runtime/downloads
          key: media-runtime-v1-macos-arm64-${{ hashFiles('scripts/media-runtime.lock.json', 'scripts/media-runtime.mjs', 'scripts/build-media-runtime.sh') }}
          restore-keys: media-runtime-v1-macos-arm64-
      - name: Validate the restored media runtime
        id: media-restored
        run: |
          mkdir -p .media-runtime/logs
          if [[ -f src-tauri/resources/media/runtime.json ]] && node scripts/media-runtime.mjs verify 2>&1 | tee .media-runtime/logs/restore.log; then
            echo 'usable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'usable=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/restore@v4
        if: steps.media-restored.outputs.usable != 'true'
        with:
          path: .media-runtime/downloads
          key: media-source-${{ hashFiles('scripts/media-runtime.lock.json') }}
          enableCrossOsArchive: true
      - name: Prepare and build verified media runtime
        if: steps.media-restored.outputs.usable != 'true'
        run: |
          brew install nasm pkg-config
          node scripts/media-runtime.mjs prepare 2>&1 | tee .media-runtime/logs/prepare.log
          bash scripts/build-media-runtime.sh 2>&1 | tee .media-runtime/logs/build.log
          node scripts/media-runtime.mjs verify 2>&1 | tee .media-runtime/logs/verify.log
      - uses: actions/cache/save@v4
        if: steps.media-cache.outputs.cache-hit != 'true'
        with:
          path: |
            src-tauri/resources/media
            .media-runtime/downloads
          key: media-runtime-v1-macos-arm64-${{ hashFiles('scripts/media-runtime.lock.json', 'scripts/media-runtime.mjs', 'scripts/build-media-runtime.sh') }}
      - uses: actions/cache/restore@v4
        id: speech-cache
        with:
          path: |
            src-tauri/resources/speech
            .speech-runtime/downloads
          key: speech-runtime-v1-macos-arm64-${{ hashFiles('scripts/speech-runtime.lock.json', 'scripts/speech-runtime.mjs', 'scripts/speech-runtime-runner.c', 'scripts/speech-runtime-runner.manifest', 'licenses/speech-runtime/manifest.json') }}
          restore-keys: speech-runtime-v1-macos-arm64-
      - name: Prepare and verify complete speech resources
        run: |
          mkdir -p .speech-runtime/logs
          node scripts/speech-runtime.mjs prepare 2>&1 | tee .speech-runtime/logs/prepare.log
          node scripts/speech-runtime.mjs verify 2>&1 | tee .speech-runtime/logs/verify.log
      - uses: actions/cache/save@v4
        if: steps.speech-cache.outputs.cache-hit != 'true'
        with:
          path: |
            src-tauri/resources/speech
            .speech-runtime/downloads
          key: speech-runtime-v1-macos-arm64-${{ hashFiles('scripts/speech-runtime.lock.json', 'scripts/speech-runtime.mjs', 'scripts/speech-runtime-runner.c', 'scripts/speech-runtime-runner.manifest', 'licenses/speech-runtime/manifest.json') }}
      - run: npm ci
      - name: Build the complete application bundle
        id: package
        run: npx tauri build --verbose --target aarch64-apple-darwin --bundles app -- --locked 2>&1 | tee test-results/macos-capture/package.log
      - name: Install and verify the current application
        id: installed
        run: |
          application='src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Open Media.app'
          test -d "$application"
          sudo rm -rf '/Applications/Open Media.app'
          sudo ditto "$application" '/Applications/Open Media.app'
          node scripts/check-macos-capture.mjs installed
      - name: Preserve the tested application
        if: always() && steps.installed.outcome == 'success'
        run: |
          mkdir -p capture-test-app
          ditto -c -k --sequesterRsrc --keepParent '/Applications/Open Media.app' 'capture-test-app/Open-Media_macos-arm64_capture-test.zip'
          shasum -a 256 'capture-test-app/Open-Media_macos-arm64_capture-test.zip' > capture-test-app/SHA256SUMS
          cp test-results/macos-capture/environment.log capture-test-app/
          cp test-results/macos-capture/installed.json capture-test-app/
      - name: Record a real screen video with the visible border
        id: with-border
        if: always() && steps.installed.outcome == 'success'
        run: node scripts/check-macos-capture.mjs with-border
      - name: Record a real screen video without the border
        id: without-border
        if: always() && steps.installed.outcome == 'success'
        run: node scripts/check-macos-capture.mjs without-border
      - name: Summarize observed results
        if: always()
        run: |
          {
            echo '## Installed macOS recording verification'
            echo
            echo "Source: $GITHUB_SHA"
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo '| Released application loader baseline | ${{ steps.baseline.outcome }} |'
            echo '| Complete current application package | ${{ steps.package.outcome }} |'
            echo '| Installed signature, linkage and identity | ${{ steps.installed.outcome }} |'
            echo '| Real recording with border | ${{ steps.with-border.outcome }} |'
            echo '| Real recording without border | ${{ steps.without-border.outcome }} |'
            echo
            echo 'The environment log records the actual OS version and build. A loader check is not a recording success. Permission denial or a missing display fails the corresponding live test; this workflow does not alter the system permission database.'
            echo
            echo '```'
            cat test-results/macos-capture/environment.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-media-macos-capture-evidence-${{ github.run_id }}
          path: |
            test-results/macos-capture/
            .media-runtime/logs/
            .speech-runtime/logs/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always() && steps.installed.outcome == 'success'
        with:
          name: open-media-macos-arm64-capture-test-${{ github.run_id }}
          path: capture-test-app/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
