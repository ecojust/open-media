name: Verify macOS preview composition

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/preview-composition.yml'
      - 'tests/fixtures/macos-webkit-frame.ts'
      - 'scripts/verify-macos-webkit.mjs'
      - 'scripts/verify-macos-webkit.swift'
      - 'src/core/preview.ts'
      - 'src/core/visual-animation.ts'
      - 'src/core/transitions.ts'
      - 'src/core/filter-renderer.ts'
      - 'src/core/clip-filters.ts'
      - 'src/core/chroma-key.ts'
      - 'src/core/timeline.ts'
      - 'src/core/project.ts'
      - 'src/core/types.ts'
      - 'src/components/VideoEditor.vue'
      - 'public/watermarks/loading-dots.mp4'
      - 'src-tauri/tauri.conf.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  composition:
    name: Realtime composition (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-26
          - platform: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Ensure fixture video encoder is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version
      - name: Verify live composition in system WKWebView
        run: |
          mkdir -p test-results/preview-composition
          set -o pipefail
          node scripts/verify-macos-webkit.mjs --output test-results/preview-composition/proof.json 2>&1 | tee test-results/preview-composition/webkit.log
      - name: Print composition evidence and failures in the job log
        if: always()
        run: |
          node --input-type=module - <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          const path = 'test-results/preview-composition/proof.json';
          if (!existsSync(path)) {
            console.log('No composition proof was produced; inspect the preceding failed step.');
          } else {
            const proof = JSON.parse(readFileSync(path, 'utf8'));
            const fields = ['passed', 'engine', 'operatingSystem', 'arch', 'commit', 'realtimeCompositionVerified', 'nativeFrameArtifactVerified', 'nativeCompositionVerified', 'realtimeIpcCalls', 'realtimeAssetRequests', 'realtimeSnapshotReads', 'error', 'realtimeError', 'harnessError', 'events', 'nativeStages'];
            console.log(JSON.stringify(Object.fromEntries(fields.filter(key => key in proof).map(key => [key, proof[key]])), null, 2));
          }
          NODE
      - name: Preserve composition proof and visible canvas snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-media-preview-composition-${{ matrix.platform }}-${{ github.run_id }}
          path: test-results/preview-composition/
          if-no-files-found: warn
          retention-days: 14
