name: Build Open Media desktop

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/cache/restore@v4
        id: speech-cache
        with:
          path: |
            src-tauri/resources/speech
            .speech-runtime/downloads
          key: speech-runtime-v1-linux-x64-${{ hashFiles('scripts/speech-runtime.lock.json', 'scripts/speech-runtime.mjs', 'scripts/speech-runtime-runner.c', 'scripts/speech-runtime-runner.manifest', 'scripts/audio-asr-runner.c', 'licenses/speech-runtime/manifest.json') }}
          restore-keys: speech-runtime-v1-linux-x64-
      - name: Prepare and verify offline speech runtime
        id: speech-verify
        run: |
          mkdir -p .speech-runtime/logs
          set -o pipefail
          node scripts/speech-runtime.mjs prepare 2>&1 | tee .speech-runtime/logs/prepare.log
          node scripts/speech-runtime.mjs verify 2>&1 | tee .speech-runtime/logs/verify.log
      - uses: actions/cache/save@v4
        if: steps.speech-cache.outputs.cache-hit != 'true'
        with:
          path: |
            src-tauri/resources/speech
            .speech-runtime/downloads
          key: speech-runtime-v1-linux-x64-${{ hashFiles('scripts/speech-runtime.lock.json', 'scripts/speech-runtime.mjs', 'scripts/speech-runtime-runner.c', 'scripts/speech-runtime-runner.manifest', 'scripts/audio-asr-runner.c', 'licenses/speech-runtime/manifest.json') }}
      - run: npm ci
      - run: npm test
      - name: Verify offline voice selection and inference devices
        run: |
          python3 tests/speech-voice-adapter.test.py
          python3 scripts/test-speech-device-runtime.py
          python3 tests/speech-device-native.test.py
          python3 tests/speech-runtime-parts.test.py
          python3 tests/native-speech-gpu-runtime.test.py
          python3 scripts/test-optional-speech-catalog.py
          python3 -B tests/verify-installed-speech.test.py
      - run: npm run build
      - name: Verify native operations
        id: native-checks
        run: |
          mkdir -p .media-runtime/logs
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked --lib 2>&1 | tee .media-runtime/logs/native-checks.log
      - name: Verify offline speech synthesis and import
        id: speech-native
        env:
          OPEN_MEDIA_SPEECH_ROOT: ${{ github.workspace }}/src-tauri/resources/speech
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked --lib speech::tests::real_offline_speech_round_trip -- --exact --ignored --nocapture --test-threads=1 2>&1 | tee .speech-runtime/logs/native.log
      - name: Verify the native MCP transport with a standard client
        run: |
          npm install --prefix "$RUNNER_TEMP/open-media-mcp-client" --no-package-lock --ignore-scripts @modelcontextprotocol/sdk@1.32.1
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked --lib --no-run --message-format=json > "$RUNNER_TEMP/open-media-native-tests.jsonl"
          test_binary=$(node --input-type=module -e 'import fs from "node:fs"; const messages = fs.readFileSync(process.argv[1], "utf8").trim().split("\n").map(line => JSON.parse(line)); const artifact = messages.find(item => item.reason === "compiler-artifact" && item.target?.name === "open_media_lib" && item.profile?.test && item.executable); if (!artifact) throw new Error("Native test executable missing"); console.log(artifact.executable);' "$RUNNER_TEMP/open-media-native-tests.jsonl")
          set -o pipefail
          node scripts/verify-mcp-protocol.mjs --server-test-binary "$test_binary" --sdk-directory "$RUNNER_TEMP/open-media-mcp-client" 2>&1 | tee .media-runtime/logs/mcp-protocol.log
      - run: npx playwright install --with-deps chromium
      - name: Select the locked browser runtime
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { chromium } from '@playwright/test';
          const executablePath = chromium.executablePath();
          const browser = await chromium.launch({ executablePath, headless: true, args: ['--no-sandbox'] });
          try {
            console.log(`Browser executable: ${executablePath}`);
            console.log(`Browser version: ${browser.version()}`);
          } finally {
            await browser.close();
          }
          for (const name of ['BROWSER_EXECUTABLE', 'CHROMIUM_PATH', 'PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH']) {
            appendFileSync(process.env.GITHUB_ENV, `${name}=${executablePath}\n`);
          }
          NODE
      - name: Verify real MCP editing jobs with the standard client
        id: mcp-editor-protocol
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/open-media-mcp-client/node_modules/@modelcontextprotocol/sdk/package.json"
          test_binary=$(node --input-type=module -e 'import fs from "node:fs"; const messages = fs.readFileSync(process.argv[1], "utf8").trim().split("\n").map(line => JSON.parse(line)); const artifact = messages.find(item => item.reason === "compiler-artifact" && item.target?.name === "open_media_lib" && item.profile?.test && item.executable); if (!artifact) throw new Error("Native test executable missing"); console.log(artifact.executable);' "$RUNNER_TEMP/open-media-native-tests.jsonl")
          test -x "$test_binary"
          node scripts/verify-mcp-editor-protocol.mjs --server-test-binary "$test_binary" --sdk-directory "$RUNNER_TEMP/open-media-mcp-client" 2>&1 | tee .media-runtime/logs/mcp-editor-protocol.log
      - name: Browser interaction checks
        id: browser
        run: |
          mkdir -p test-results/browser
          set -o pipefail
          npm run test:browser 2>&1 | tee test-results/browser/browser.log
          node tests/browser/preview-composite.cjs --app 2>&1 | tee -a test-results/browser/browser.log
          node tests/browser/preview-blur.cjs 2>&1 | tee -a test-results/browser/browser.log
          node tests/browser/preview-blur.cjs --native 2>&1 | tee -a test-results/browser/browser.log
        env:
          BROWSER_ARTIFACTS: test-results/browser
      - name: Summarize browser failures
        if: failure() && steps.browser.outcome == 'failure'
        run: node scripts/report-build-failure.mjs test-results/browser/browser.log
      - name: Summarize native operation failures
        if: failure() && steps.native-checks.outcome == 'failure'
        run: node scripts/report-build-failure.mjs .media-runtime/logs/native-checks.log
      - name: Summarize MCP editing protocol failures
        if: failure() && steps.mcp-editor-protocol.outcome == 'failure'
        run: node scripts/report-build-failure.mjs .media-runtime/logs/mcp-editor-protocol.log
      - name: Summarize speech failures
        if: failure()
        run: |
          if [[ '${{ steps.speech-verify.outcome }}' == failure ]]; then node scripts/report-build-failure.mjs .speech-runtime/logs/prepare.log .speech-runtime/logs/verify.log; fi
          if [[ '${{ steps.speech-native.outcome }}' == failure ]]; then node scripts/report-build-failure.mjs .speech-runtime/logs/native.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-media-checks-${{ github.run_id }}
          path: |
            test-results/browser/
            .media-runtime/logs/native-checks.log
            .media-runtime/logs/mcp-protocol.log
            .media-runtime/logs/mcp-editor-protocol.log
            .speech-runtime/logs/
            .speech-runtime/verification/**/*.log
            .speech-runtime/verification/**/proof.json
          if-no-files-found: warn
          retention-days: 14
  runtime-source:
    name: Corresponding media source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: .media-runtime/downloads
          key: media-source-${{ hashFiles('scripts/media-runtime.lock.json') }}
          enableCrossOsArchive: true
      - uses: actions/cache@v4
        with:
          path: .speech-runtime/downloads
          key: speech-source-${{ hashFiles('scripts/speech-runtime.lock.json') }}
          enableCrossOsArchive: true
      - name: Package complete corresponding source
        id: complete-source
        run: |
          mkdir -p source-artifacts
          mkdir -p source-logs
          set -o pipefail
          node scripts/media-runtime.mjs sources --output source-artifacts/open-media-runtime-source.tar.gz 2>&1 | tee source-logs/media.log
          node scripts/speech-runtime.mjs sources --output source-artifacts/open-media-speech-source.tar.gz 2>&1 | tee source-logs/speech.log
          sha256sum source-artifacts/open-media-runtime-source.tar.gz source-artifacts/open-media-speech-source.tar.gz | sed 's|source-artifacts/||' > source-artifacts/SHA256SUMS
          cp THIRD_PARTY_NOTICES.md source-artifacts/
          cp LICENSE source-artifacts/
          printf '{"commit":"%s","kind":"corresponding-source"}\n' '${{ github.sha }}' > source-artifacts/build.json
      - name: Summarize corresponding source failures
        if: failure() && steps.complete-source.outcome == 'failure'
        run: node scripts/report-build-failure.mjs source-logs/media.log source-logs/speech.log
      - uses: actions/upload-artifact@v4
        with:
          name: open-media-runtime-source-${{ github.run_id }}
          path: source-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  desktop:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 210
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select compiler SDK for native video generation
        if: matrix.platform == 'macos-arm64'
        run: python3 scripts/video-generation-select-sdk.py
      - name: Verify voice adapter and device fallback on the desktop platform
        run: |
          python tests/speech-voice-adapter.test.py
          python scripts/test-speech-device-runtime.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - uses: actions/cache@v4
        id: media-cache
        with:
          path: |
            src-tauri/resources/media
            .media-runtime/downloads
          key: media-runtime-v1-${{ matrix.platform }}-${{ hashFiles('scripts/media-runtime.lock.json', 'scripts/media-runtime.mjs', 'scripts/media-runtime-capabilities.mjs', 'scripts/build-media-runtime.sh') }}
          restore-keys: media-runtime-v1-${{ matrix.platform }}-
      - name: Validate restored media runtime against current sources
        id: media-restored
        run: |
          mkdir -p .media-runtime/logs
          if [[ -f src-tauri/resources/media/runtime.json ]] && node scripts/media-runtime.mjs verify 2>&1 | tee .media-runtime/logs/restore.log; then
            echo 'usable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'usable=false' >> "$GITHUB_OUTPUT"
            echo 'No valid restored runtime; building from the verified source archives.'
          fi
      - name: Restore verified source downloads
        if: steps.media-restored.outputs.usable != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .media-runtime/downloads
          key: media-source-${{ hashFiles('scripts/media-runtime.lock.json') }}
          enableCrossOsArchive: true
      - name: Install media build tools on Windows
        if: runner.os == 'Windows' && steps.media-restored.outputs.usable != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            make diffutils perl nasm
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
      - name: Install media build tools on macOS
        if: runner.os == 'macOS' && steps.media-restored.outputs.usable != 'true'
        run: brew install nasm pkg-config
      - name: Prepare verified media sources
        id: media-prepare
        if: steps.media-restored.outputs.usable != 'true'
        run: |
          mkdir -p .media-runtime/logs
          node scripts/media-runtime.mjs prepare 2>&1 | tee .media-runtime/logs/prepare.log
      - name: Build media tools on Windows
        id: media-windows
        if: runner.os == 'Windows' && steps.media-restored.outputs.usable != 'true'
        shell: msys2 {0}
        run: |
          set -o pipefail
          bash scripts/build-media-runtime.sh 2>&1 | tee .media-runtime/logs/build.log
      - name: Build media tools on macOS
        id: media-macos
        if: runner.os == 'macOS' && steps.media-restored.outputs.usable != 'true'
        run: bash scripts/build-media-runtime.sh 2>&1 | tee .media-runtime/logs/build.log
      - name: Verify the bundled executables
        id: media-verify
        if: steps.media-restored.outputs.usable != 'true'
        run: |
          mkdir -p .media-runtime/logs
          node scripts/media-runtime.mjs verify 2>&1 | tee .media-runtime/logs/verify.log
      - name: Save verified media runtime independently of application packaging
        if: steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src-tauri/resources/media
            .media-runtime/downloads
          key: media-runtime-v1-${{ matrix.platform }}-${{ hashFiles('scripts/media-runtime.lock.json', 'scripts/media-runtime.mjs', 'scripts/media-runtime-capabilities.mjs', 'scripts/build-media-runtime.sh') }}
      - uses: actions/cache/restore@v4
        id: speech-cache
        with:
          path: |
            src-tauri/resources/speech
            .speech-runtime/downloads
          key: speech-runtime-v1-${{ matrix.platform }}-${{ hashFiles('scripts/speech-runtime.lock.json', 'scripts/speech-runtime.mjs', 'scripts/speech-runtime-runner.c', 'scripts/speech-runtime-runner.manifest', 'scripts/audio-asr-runner.c', 'licenses/speech-runtime/manifest.json') }}
          restore-keys: speech-runtime-v1-${{ matrix.platform }}-
      - name: Prepare native speech compiler on Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Select native linker for Windows application builds
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:VCToolsInstallDir) { throw 'The native compiler environment is missing.' }
          $linker = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/link.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) { throw "Native linker was not found: $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
          Write-Host "Rust host and target linker: $linker"
      - name: Prepare and verify offline speech runtime
        id: speech-verify
        run: |
          mkdir -p .speech-runtime/logs
          set -o pipefail
          node scripts/speech-runtime.mjs prepare 2>&1 | tee .speech-runtime/logs/prepare.log
          node scripts/speech-runtime.mjs verify 2>&1 | tee .speech-runtime/logs/verify.log
      - uses: actions/cache/save@v4
        if: steps.speech-cache.outputs.cache-hit != 'true'
        with:
          path: |
            src-tauri/resources/speech
            .speech-runtime/downloads
          key: speech-runtime-v1-${{ matrix.platform }}-${{ hashFiles('scripts/speech-runtime.lock.json', 'scripts/speech-runtime.mjs', 'scripts/speech-runtime-runner.c', 'scripts/speech-runtime-runner.manifest', 'scripts/audio-asr-runner.c', 'licenses/speech-runtime/manifest.json') }}
      - name: Install application dependencies
        run: npm ci
      - name: Build application frontend
        run: npm run build
      - name: Verify frame artifacts in the actual macOS WebKit engine
        id: webkit-frame
        if: runner.os == 'macOS'
        env:
          OPEN_MEDIA_FFMPEG: ${{ github.workspace }}/src-tauri/resources/media/ffmpeg
        run: |
          mkdir -p .media-runtime/logs
          set -o pipefail
          node scripts/verify-macos-webkit.mjs 2>&1 | tee .media-runtime/logs/webkit.log
      - name: Preserve actual WebKit frame verification evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: open-media-webkit-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            .media-runtime/logs/webkit.log
            .media-runtime/logs/webkit-proof.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify native operations with packaged runtime
        id: native-tests
        env:
          OPEN_MEDIA_FFMPEG: ${{ github.workspace }}/src-tauri/resources/media/ffmpeg${{ runner.os == 'Windows' && '.exe' || '' }}
          OPEN_MEDIA_FFPROBE: ${{ github.workspace }}/src-tauri/resources/media/ffprobe${{ runner.os == 'Windows' && '.exe' || '' }}
          OPEN_MEDIA_SPEECH_ROOT: ${{ github.workspace }}/src-tauri/resources/speech
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }} --lib 2>&1 | tee .media-runtime/logs/native.log
      - name: Verify offline speech synthesis and import
        id: speech-native
        env:
          OPEN_MEDIA_FFMPEG: ${{ github.workspace }}/src-tauri/resources/media/ffmpeg${{ runner.os == 'Windows' && '.exe' || '' }}
          OPEN_MEDIA_FFPROBE: ${{ github.workspace }}/src-tauri/resources/media/ffprobe${{ runner.os == 'Windows' && '.exe' || '' }}
          OPEN_MEDIA_SPEECH_ROOT: ${{ github.workspace }}/src-tauri/resources/speech
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }} --lib speech::tests::real_offline_speech_round_trip -- --exact --ignored --nocapture --test-threads=1 2>&1 | tee .speech-runtime/logs/native.log
      - name: Package application
        id: native-package
        run: npx tauri build --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked 2>&1 | tee .media-runtime/logs/package.log
      - name: Verify native recording mode
        id: capture-helper
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          application="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Open Media.app"
          executable="$application/Contents/MacOS/open-media"
          test -x "$executable"
          test ! -e "$application/Contents/Frameworks/libopen_media_capture.dylib"
          if otool -L "$executable" | grep -F 'libopen_media_capture'; then
            echo 'Recording must be linked into the main executable.' >&2
            exit 1
          fi
          codesign --verify --deep --strict "$application"
          node scripts/check-macos-permissions.mjs "$application" 2>&1 | tee .media-runtime/logs/capture-helper.log
          "$executable" --open-media-capture --self-test 2>&1 | tee -a .media-runtime/logs/capture-helper.log
          node --input-type=module - <<'NODE' 2>&1 | tee -a .media-runtime/logs/capture-helper.log
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const records = readFileSync('.media-runtime/logs/capture-helper.log', 'utf8').split(/\r?\n/).flatMap(line => {
            try {
              const entry = JSON.parse(line)
              return entry && typeof entry === 'object' && 'captureIdentityMode' in entry ? [entry] : []
            } catch { return [] }
          })
          assert.equal(records.length, 1, 'The recording mode must report exactly one application identity.')
          assert.equal(records[0].captureIdentityMode, 'packaged', 'The installed recording mode must recognize its application bundle.')
          assert.equal(records[0].captureApplicationIdentifier, 'com.ecojust.openmedia', 'The recording mode must use the main application identity.')
          console.log('Verified packaged recording mode and main application identity.')
          NODE
      - name: Verify offline speech from the packaged application
        id: speech-package-macos
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          application="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Open Media.app"
          node scripts/speech-runtime.mjs verify --directory "$application/Contents/Resources/speech" --executable-directory "$application/Contents/Helpers/speech" --packaged 2>&1 | tee .speech-runtime/logs/package.log
      - name: Install and verify offline speech from the packaged application
        id: speech-package-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem 'src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe')
          if ($installer.Count -ne 1) { throw 'Expected one desktop installer.' }
          $destination = Join-Path $env:RUNNER_TEMP 'Open Media 语音验证'
          $process = Start-Process -FilePath $installer[0].FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          node scripts/speech-runtime.mjs verify --directory "$destination/speech" --packaged 2>&1 | Tee-Object .speech-runtime/logs/package.log
          if ($LASTEXITCODE -ne 0) { throw 'Packaged speech verification failed.' }
      # 暂停逐音色模型验证；恢复时取消下方注释，并启用 scripts/release-policy.json 中的对应检查。
      # - name: Verify every installed speech voice
      #   id: all-speech-voices
      #   shell: python
      #   env:
      #     MEDIA_PLATFORM: ${{ matrix.platform }}
      #     MEDIA_TARGET: ${{ matrix.target }}
      #     PYTHONUTF8: '1'
      #     PYTHONUNBUFFERED: '1'
      #     OPEN_MEDIA_FFMPEG: ${{ github.workspace }}/src-tauri/resources/media/ffmpeg${{ runner.os == 'Windows' && '.exe' || '' }}
      #     OPEN_MEDIA_FFPROBE: ${{ github.workspace }}/src-tauri/resources/media/ffprobe${{ runner.os == 'Windows' && '.exe' || '' }}
      #   run: |
      #     import os, subprocess, sys
      #     from pathlib import Path
      #     workspace = Path(os.environ['GITHUB_WORKSPACE'])
      #     target = os.environ['MEDIA_TARGET']
      #     if sys.platform == 'darwin':
      #         application = workspace / 'src-tauri/target' / target / 'release/bundle/macos/Open Media.app/Contents'
      #         speech = application / 'Resources/speech'
      #         executables = application / 'Helpers/speech'
      #     else:
      #         speech = Path(os.environ['RUNNER_TEMP']) / 'Open Media 语音验证/speech'
      #         executables = speech
      #     subprocess.run([
      #         sys.executable, 'scripts/verify-installed-speech.py',
      #         '--platform', os.environ['MEDIA_PLATFORM'], '--target', target,
      #         '--speech-directory', str(speech), '--speech-executable-directory', str(executables),
      #         '--work', str(Path(os.environ['RUNNER_TEMP']) / '完整配音 验证'),
      #         '--output', str(workspace / '.speech-runtime/installed-voice-validation'),
      #     ], check=True, cwd=workspace)
      - name: Preserve actual voice results and inference device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-media-speech-validation-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            .speech-runtime/installed-voice-validation/
            .speech-runtime/logs/
            .speech-runtime/verification/**/*.log
            .speech-runtime/verification/**/proof.json
            .media-runtime/verification/hardware-encoding.json
          if-no-files-found: warn
          retention-days: 30
      - name: Collect installers and provenance
        env:
          MEDIA_TARGET: ${{ matrix.target }}
          MEDIA_PLATFORM: ${{ matrix.platform }}
          MEDIA_COMMIT: ${{ github.sha }}
        run: node scripts/collect-desktop.mjs
      - name: Summarize media build failures
        if: failure()
        env:
          MEDIA_PREPARE_OUTCOME: ${{ steps.media-prepare.outcome }}
          MEDIA_WINDOWS_OUTCOME: ${{ steps.media-windows.outcome }}
          MEDIA_MACOS_OUTCOME: ${{ steps.media-macos.outcome }}
          MEDIA_VERIFY_OUTCOME: ${{ steps.media-verify.outcome }}
          NATIVE_TEST_OUTCOME: ${{ steps.native-tests.outcome }}
          NATIVE_PACKAGE_OUTCOME: ${{ steps.native-package.outcome }}
          WEBKIT_FRAME_OUTCOME: ${{ steps.webkit-frame.outcome }}
          CAPTURE_HELPER_OUTCOME: ${{ steps.capture-helper.outcome }}
          SPEECH_VERIFY_OUTCOME: ${{ steps.speech-verify.outcome }}
          SPEECH_NATIVE_OUTCOME: ${{ steps.speech-native.outcome }}
          SPEECH_PACKAGE_MACOS_OUTCOME: ${{ steps.speech-package-macos.outcome }}
          SPEECH_PACKAGE_WINDOWS_OUTCOME: ${{ steps.speech-package-windows.outcome }}
        run: |
          if [[ "$MEDIA_PREPARE_OUTCOME" == failure ]]; then node scripts/report-build-failure.mjs .media-runtime/logs/prepare.log; fi
          if [[ "$MEDIA_WINDOWS_OUTCOME" == failure || "$MEDIA_MACOS_OUTCOME" == failure ]]; then node scripts/report-build-failure.mjs .media-runtime/logs/build.log; fi
          if [[ "$MEDIA_VERIFY_OUTCOME" == failure ]]; then node scripts/report-build-failure.mjs .media-runtime/logs/verify.log; fi
          if [[ "$NATIVE_TEST_OUTCOME" == failure ]]; then node scripts/report-build-failure.mjs .media-runtime/logs/native.log; fi
          if [[ "$NATIVE_PACKAGE_OUTCOME" == failure ]]; then node scripts/report-build-failure.mjs .media-runtime/logs/package.log; fi
          if [[ "$WEBKIT_FRAME_OUTCOME" == failure ]]; then node scripts/report-build-failure.mjs .media-runtime/logs/webkit.log .media-runtime/logs/webkit-proof.json; fi
          if [[ "$CAPTURE_HELPER_OUTCOME" == failure ]]; then node scripts/report-build-failure.mjs .media-runtime/logs/capture-helper.log; fi
          if [[ "$SPEECH_VERIFY_OUTCOME" == failure ]]; then node scripts/report-build-failure.mjs .speech-runtime/logs/prepare.log .speech-runtime/logs/verify.log; fi
          if [[ "$SPEECH_NATIVE_OUTCOME" == failure ]]; then node scripts/report-build-failure.mjs .speech-runtime/logs/native.log; fi
          if [[ "$SPEECH_PACKAGE_MACOS_OUTCOME" == failure || "$SPEECH_PACKAGE_WINDOWS_OUTCOME" == failure ]]; then node scripts/report-build-failure.mjs .speech-runtime/logs/package.log; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: open-media-build-log-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            .media-runtime/logs/
            .speech-runtime/logs/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: open-media-${{ matrix.platform }}-${{ github.run_id }}
          path: desktop-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
