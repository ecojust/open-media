name: Speech runtime diagnostics

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Completed runtime job whose logs should be inspected
        type: string
        default: '117464202971'
        required: true
  push:
    branches: ['work/speech-runtime-diagnostics-*']

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_JOB_ID: ${{ inputs.job_id || '117464202971' }}
      PYTHONUTF8: '1'
    steps:
      - name: Read the existing job log without rerunning speech generation
        id: source
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          job = os.environ['TARGET_JOB_ID']
          if not re.fullmatch(r'[1-9][0-9]{0,19}', job):
              raise ValueError('Expected a numeric job identifier')
          repository = os.environ['GITHUB_REPOSITORY']
          api_headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                         'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          def redact(value):
              value = value.replace(os.environ['GH_TOKEN'], '[redacted]')
              return re.sub(r'(https?://[^\s?]+)\?[^\s]+', r'\1?[redacted]', value)
          try:
              metadata_request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/actions/jobs/{job}', headers=api_headers)
              with urllib.request.urlopen(metadata_request, timeout=60) as metadata_response:
                  metadata = json.load(metadata_response)
              target_platform = next((p for p in ('windows-x64', 'macos-x64', 'macos-arm64') if p in metadata['name']), None)
              if target_platform:
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as outputs:
                      outputs.write(f"run_id={int(metadata['run_id'])}\n")
                      outputs.write(f"artifact_name=speech-runtime-evidence-{target_platform}-{int(metadata['run_id'])}\n")
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/actions/jobs/{job}/logs',
                  headers=api_headers)
              try:
                  with urllib.request.build_opener(NoRedirect).open(request, timeout=60) as response:
                      data = response.read()
              except urllib.error.HTTPError as response:
                  if response.code not in (301, 302, 303, 307, 308):
                      raise RuntimeError(f'GitHub job logs API HTTP {response.code}: ' + response.read().decode('utf-8', errors='replace'))
                  location = response.headers.get('Location', '')
                  if urllib.parse.urlparse(location).scheme != 'https':
                      raise ValueError('Expected an HTTPS log download location')
                  # New request deliberately has no GitHub Authorization header.
                  with urllib.request.urlopen(location, timeout=120) as download:
                      data = download.read()
          except Exception as error:
              detail = redact(str(error)).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Log retrieval failure::{detail}')
              raise SystemExit(1)
          text = data.decode('utf-8', errors='replace')
          output = Path('runtime-diagnostics')
          output.mkdir()
          (output / f'job-{job}.log').write_text(text, encoding='utf-8')
          lines = text.splitlines()
          indices = set()
          for i, line in enumerate(lines):
              if any(word in line for word in ['Traceback (most recent call last)', 'UnicodeEncodeError', 'RuntimeError:', 'ValueError:', 'Error:', 'error:', 'FAILED', 'Process completed with exit code']):
                  indices.update(range(max(0, i - 8), min(len(lines), i + 22)))
          selected = redact('\n'.join(lines[i] for i in sorted(indices))[-45000:] if indices else text[-24000:])
          (output / 'error-extract.log').write_text(selected, encoding='utf-8')
          for start in range(0, len(selected), 2500):
              part = selected[start:start + 2500]
              escaped = part.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::warning title=Runtime job {job}, part {start // 2500 + 1}::{escaped}')
          PY
      - name: Read preserved build diagnostics
        if: steps.source.outputs.artifact_name != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: ${{ steps.source.outputs.artifact_name }}
          path: existing-runtime-evidence
      - name: Expose native compilation and runtime audit errors
        if: steps.source.outputs.artifact_name != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('existing-runtime-evidence').rglob('normalizer-build.log'):
              text = path.read_text(encoding='utf-8', errors='replace')[-45000:]
              Path('runtime-diagnostics/normalizer-build.log').write_text(text, encoding='utf-8')
              for start in range(0, len(text), 2500):
                  part = text[start:start + 2500]
                  escaped = part.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::warning title=Native compiler, part {start // 2500 + 1}::{escaped}')
          for path in Path('existing-runtime-evidence').rglob('macos-native-audit.json'):
              audit = json.loads(path.read_text(encoding='utf-8'))
              problems = [entry for entry in audit['files'] if entry.get('signatureValid') is False or
                          any(tuple(int(x) for x in value.split('.')[:2]) > (13, 0) for value in entry.get('minimumMacOS', []))]
              text = json.dumps({'inspectedFiles': len(audit['files']), 'problemCount': len(problems)}, ensure_ascii=False) + '\n' + '\n'.join(json.dumps(entry, ensure_ascii=False) for entry in problems)
              Path('runtime-diagnostics/macos-native-audit.json').write_text(path.read_text(encoding='utf-8'), encoding='utf-8')
              for start in range(0, len(text), 2500):
                  escaped = text[start:start+2500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::warning title=Complete native audit, part {start // 2500 + 1}::{escaped}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: speech-runtime-diagnostics-${{ github.run_id }}
          retention-days: 7
          path: runtime-diagnostics/
