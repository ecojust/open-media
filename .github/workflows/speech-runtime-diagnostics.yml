name: Existing desktop proof diagnostics

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Completed desktop job whose existing proof should be inspected
        type: string
        default: '118424367063'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_JOB_ID: ${{ inputs.job_id }}
      PYTHONUTF8: '1'
    steps:
      - name: Identify preserved proof from the selected job
        id: source
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          job = os.environ['TARGET_JOB_ID']
          if not re.fullmatch(r'[1-9][0-9]{0,19}', job):
              raise ValueError('Expected a numeric job identifier')
          repository = os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def get(path):
              request = urllib.request.Request('https://api.github.com/repos/' + repository + path, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          metadata = get('/actions/jobs/' + job)
          assert metadata['status'] == 'completed', 'Proof belongs to a completed job'
          platform = next((p for p in ('macos-x64', 'macos-arm64') if p in metadata['name']), None)
          assert platform, 'Expected a desktop macOS job'
          run_id = int(metadata['run_id'])
          run = get(f'/actions/runs/{run_id}')
          assert run['path'] == '.github/workflows/desktop-build.yml'
          artifact_name = f'open-media-webkit-{platform}-{run_id}'
          artifacts = get(f'/actions/runs/{run_id}/artifacts?per_page=100')['artifacts']
          selected = [artifact for artifact in artifacts if artifact['name'] == artifact_name and not artifact['expired']]
          assert len(selected) == 1, 'Expected one preserved proof artifact'
          artifact = selected[0]
          assert artifact['size_in_bytes'] < 2 * 1024 * 1024, 'Only small proof artifacts may be inspected'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as outputs:
              outputs.write(f"run_id={run_id}\nartifact_name={artifact_name}\nplatform={platform}\nsource_sha={run['head_sha']}\nartifact_id={artifact['id']}\n")
          print(json.dumps({'jobId':job, 'sourceRun':run_id, 'sourceCommit':run['head_sha'], 'platform':platform, 'artifactId':artifact['id'], 'artifactBytes':artifact['size_in_bytes']}))
          PY
      - name: Download the existing proof without rerunning the application
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: ${{ steps.source.outputs.artifact_name }}
          path: existing-proof
      - name: Expose full proof and precise realtime media samples
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_PLATFORM: ${{ steps.source.outputs.platform }}
          SOURCE_ARTIFACT: ${{ steps.source.outputs.artifact_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          paths = list(Path('existing-proof').rglob('webkit-proof.json'))
          assert len(paths) == 1, 'Expected exactly one preserved JSON proof'
          proof = json.loads(paths[0].read_text(encoding='utf-8'))
          assert proof['commit'] == os.environ['SOURCE_SHA'], 'Source commit differs from the selected build'
          assert proof['arch'] == {'macos-x64':'x64', 'macos-arm64':'arm64'}[os.environ['SOURCE_PLATFORM']]
          provenance = {'jobId':os.environ['TARGET_JOB_ID'], 'sourceRun':os.environ['SOURCE_RUN'], 'sourceCommit':proof['commit'], 'platform':os.environ['SOURCE_PLATFORM'], 'artifactId':os.environ['SOURCE_ARTIFACT']}
          def annotate(title, value):
              text = json.dumps(value, ensure_ascii=False, separators=(',', ':'))
              for offset in range(0, len(text), 5000):
                  part = text[offset:offset+5000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::warning title={title} part {offset // 5000 + 1}::{part}')
          annotate('Proof provenance', provenance)
          annotate('Complete preserved proof', proof)
          for event in proof.get('events', []):
              if event.get('stage') == 'realtime-sample':
                  annotate('Realtime sample ' + str(event.get('label')) + ' at ' + str(event.get('time')), event)
          PY
