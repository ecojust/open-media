name: Shared AI native and adapter checks

on:
  workflow_dispatch:
  push:
    branches: ['feat/shared-ai-generation-20261019']
    paths:
      - '.github/workflows/shared-ai-checks.yml'
      - 'src-tauri/src/**'
      - 'src-tauri/Cargo.*'
      - 'src-tauri/build.rs'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/resources/ai-*.json'
      - 'scripts/ai-*-runner.py'
      - 'scripts/test-ai-*-runner.py'

permissions:
  contents: read
  checks: write

concurrency:
  group: shared-ai-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  HF_DATASETS_OFFLINE: '1'

jobs:
  native:
    name: Native integration — ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2022
          - platform: linux-x64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the image contract dependency
        run: python -m pip install --disable-pip-version-check Pillow==12.0.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Select the native compiler SDK
        if: runner.os == 'macOS'
        run: python scripts/video-generation-select-sdk.py
      - name: Install Linux desktop development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: shared-ai-native
          cache-on-failure: true
      - name: Verify image and music adapter contracts without model weights
        id: adapters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/shared-ai
          python -B scripts/test-ai-image-runner.py 2>&1 | tee test-results/shared-ai/image-contracts.log
          python -B scripts/test-ai-music-runner.py 2>&1 | tee test-results/shared-ai/music-contracts.log
      - name: Verify shared model downloads, inference scheduling and process lifecycle
        id: native
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked --lib ai_ -- --nocapture 2>&1 | tee test-results/shared-ai/native-contracts.log
      - name: Verify the application-wide model service
        id: service
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked --lib ai:: -- --nocapture 2>&1 | tee test-results/shared-ai/service-contracts.log
      - name: Check desktop command and application integration
        id: desktop
        shell: bash
        env:
          # Desktop command types are compiled here. Complete installer resources
          # remain the responsibility of the separate desktop packaging workflow.
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: |
          set -euo pipefail
          cargo check --manifest-path src-tauri/Cargo.toml --locked --lib 2>&1 | tee test-results/shared-ai/desktop-check.log
      - name: Verify streamed project archives and file targets
        id: projects
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked --lib project_ -- --nocapture 2>&1 | tee test-results/shared-ai/project-files.log
      - name: Verify mirror failover and resumable downloads for existing model providers
        id: mirrors
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked --lib speech_models:: -- --nocapture 2>&1 | tee test-results/shared-ai/speech-downloads.log
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked --lib video_generation::download:: -- --nocapture 2>&1 | tee test-results/shared-ai/video-downloads.log
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked --lib audio_tools_asr:: -- --nocapture 2>&1 | tee test-results/shared-ai/recognition-downloads.log
      - name: Report validation failures
        if: failure()
        shell: bash
        run: node scripts/report-build-failure.mjs test-results/shared-ai/*.log
      - name: Preserve native validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-ai-${{ matrix.platform }}-${{ github.run_id }}-adapters_${{ steps.adapters.outcome }}-native_${{ steps.native.outcome }}-service_${{ steps.service.outcome }}-desktop_${{ steps.desktop.outcome }}-mirrors_${{ steps.mirrors.outcome }}
          path: test-results/shared-ai/
          retention-days: 14
          if-no-files-found: warn
      - name: Publish completed validation evidence
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATION_PLATFORM: ${{ matrix.platform }}
          ADAPTER_OUTCOME: ${{ steps.adapters.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          SERVICE_OUTCOME: ${{ steps.service.outcome }}
          DESKTOP_OUTCOME: ${{ steps.desktop.outcome }}
          MIRRORS_OUTCOME: ${{ steps.mirrors.outcome }}
          PROJECTS_OUTCOME: ${{ steps.projects.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const outcomes = {
              adapters: process.env.ADAPTER_OUTCOME,
              native: process.env.NATIVE_OUTCOME,
              service: process.env.SERVICE_OUTCOME,
              desktop: process.env.DESKTOP_OUTCOME,
              mirrors: process.env.MIRRORS_OUTCOME,
              projects: process.env.PROJECTS_OUTCOME,
            };
            const values = Object.values(outcomes);
            const conclusion = values.every(value => value === 'success') ? 'success'
              : values.includes('failure') ? 'failure'
              : values.includes('cancelled') ? 'cancelled' : 'neutral';
            const logs = ['image-contracts', 'music-contracts', 'native-contracts', 'service-contracts', 'desktop-check', 'project-files', 'speech-downloads', 'video-downloads', 'recognition-downloads'];
            const sanitize = value => value.replace(/\u001b\[[0-9;]*m/g, '')
              .replace(/https?:\/\/[^\s"<>]+/g, url => url.split('?')[0])
              .replace(/(Bearer\s+|(?:token|password|secret|authorization)\s*[=:]\s*)[^\s,;]+/gi, '$1[redacted]');
            const text = logs.map(name => {
              const file = `test-results/shared-ai/${name}.log`;
              if (!fs.existsSync(file)) return `### ${name}\nNo log produced; see step outcomes.`;
              const tail = sanitize(fs.readFileSync(file, 'utf8')).trim().split(/\r?\n/).slice(-45).join('\n').slice(-6000);
              return `### ${name}\n\n\`\`\`text\n${tail}\n\`\`\``;
            }).join('\n\n');
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `Shared AI evidence — ${process.env.VALIDATION_PLATFORM}`,
              head_sha: context.sha,
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: `Shared AI ${process.env.VALIDATION_PLATFORM}: ${conclusion}`,
                summary: `Run ${context.runId}; commit ${context.sha}.\n\n\`\`\`json\n${JSON.stringify(outcomes, null, 2)}\n\`\`\`\n\nNo model weights are downloaded by these contract and compilation checks.`,
                text,
              },
            });
