name: Chinese voice benchmark

on:
  workflow_dispatch:
    inputs:
      threads:
        description: CPU inference threads
        type: choice
        options: ['4', '2']
        default: '4'

permissions:
  contents: read

jobs:
  chinese-large-model:
    name: Chinese samples ${{ matrix.start }} and next
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        start: [1, 3, 5, 7, 9]
    env:
      PYTHONUNBUFFERED: '1'
      PIP_NO_CACHE_DIR: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare CPU audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 sox
          python -m pip install 'torch==2.9.1+cpu' 'torchaudio==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r test/chinese-tts-benchmark/scripts/requirements-qwen.txt
      - name: Record execution environment
        run: |
          mkdir -p benchmark-output/qwen3-tts-1.7b-serena/logs
          python -m pip freeze > benchmark-output/qwen3-tts-1.7b-serena/logs/packages.txt
          lscpu > benchmark-output/qwen3-tts-1.7b-serena/logs/cpu.txt
          free -h > benchmark-output/qwen3-tts-1.7b-serena/logs/memory.txt
          df -h > benchmark-output/qwen3-tts-1.7b-serena/logs/disk.txt
          git rev-parse HEAD > benchmark-output/qwen3-tts-1.7b-serena/logs/source-commit.txt
      - name: Generate original Chinese corpus locally on runner
        shell: bash
        run: |
          set -o pipefail
          python test/chinese-tts-benchmark/scripts/generate-qwen.py \
            --corpus test/chinese-tts-benchmark/corpus.json \
            --model-dir "$RUNNER_TEMP/qwen3-tts-model" \
            --output benchmark-output/qwen3-tts-1.7b-serena \
            --threads '${{ inputs.threads }}' \
            --start '${{ matrix.start }}' \
            --limit 2 \
            --dtype auto \
            2>&1 | tee benchmark-output/qwen3-tts-1.7b-serena/logs/generation.log
      - name: Upload completed audio and generation records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chinese-voice-qwen3-1.7b-${{ github.run_id }}-part-${{ matrix.start }}
          path: benchmark-output/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
